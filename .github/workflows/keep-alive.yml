
name: Keep Render backend awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://novaphone-xj08.onrender.com/api/health || echo "Ping thất bại, backend có thể đang khởi động lại"